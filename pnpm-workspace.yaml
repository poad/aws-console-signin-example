packages:
  - ./**
  - '!**/.next'
  - '!**/cdk.out'

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@112.23.0

overrides:
  chokidar: '>=5'
  minimatch@<11.0.1: ^11.0.1
  semver: '>=7'

trustPolicy: no-downgrade
