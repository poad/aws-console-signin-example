packages:
  - ./**
  - '!**/.next'
  - '!**/cdk.out'

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@112.13.0

  - next@16.4.1
  - eslint-config-next@16.4.1
  - '@next/eslint-plugin-next@16.4.1'

overrides:
  chokidar: '>=5'
  semver: '>=7'

trustPolicy: no-downgrade
